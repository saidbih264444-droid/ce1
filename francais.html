<style>
/* Layout: carnet d'école. Accueil en grille de séances par unité, leçon en une colonne qui défile, exercices en cartes. */
:root{
  --bg:#EEF5F9;--surface:#FFFFFF;--ink:#15303D;--muted:#5B7280;--line:#D3E2EA;
  --u0:#2C78D2;--u0bg:#DEEAFA;--u1:#1E9E6A;--u1bg:#DDF3E9;--u2:#D63F7E;--u2bg:#FBE1EC;
  --ok:#1E9E6A;--okbg:#DDF3E9;--bad:#D6453D;--badbg:#FBE4E2;--sun:#F4B72E;--ar:#0F5C7A;
  --fd:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--fb:'Nunito',system-ui,'Segoe UI',sans-serif;--fa:'Cairo','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
  --acc:var(--u0);--accbg:var(--u0bg);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1C24;--surface:#182933;--ink:#E6F0F5;--muted:#9FB5C2;--line:#2A404D;
  --u0:#6AA8F0;--u0bg:#1B3050;--u1:#46C592;--u1bg:#17372C;--u2:#F0689D;--u2bg:#3D1F2C;
  --ok:#46C592;--okbg:#17372C;--bad:#F0766E;--badbg:#3F2220;--sun:#F4C45A;--ar:#8FD3F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1C24;--surface:#182933;--ink:#E6F0F5;--muted:#9FB5C2;--line:#2A404D;
  --u0:#6AA8F0;--u0bg:#1B3050;--u1:#46C592;--u1bg:#17372C;--u2:#F0689D;--u2bg:#3D1F2C;
  --ok:#46C592;--okbg:#17372C;--bad:#F0766E;--badbg:#3F2220;--sun:#F4C45A;--ar:#8FD3F0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 18px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,circle:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ar{font-family:var(--fa);color:var(--ar);direction:rtl;text-align:right;font-weight:500;line-height:1.7}
.bi{display:flex;flex-direction:column;gap:0;min-width:0}
body.noar .ar{display:none}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;text-wrap:balance}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--fd);font-weight:800;font-size:1.3rem;color:var(--ink);text-decoration:none;margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--u1);color:#fff;border-radius:10px;padding:0 9px;font-size:1rem}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;min-height:40px;font-weight:800;font-size:.9rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* home */
.hero{padding:24px 0 8px;display:grid;gap:6px}
.hero h1{font-size:clamp(2rem,7vw,3rem)}
.hero .sub{color:var(--muted)}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.meter b{display:block;height:100%;background:var(--u1);border-radius:99px;transition:width .5s}
.unit{margin-top:30px}
.unit h2{font-size:1.35rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.unit h2 span.tag{font-size:.8rem;font-family:var(--fb);font-weight:800;background:var(--accbg);color:var(--acc);padding:2px 10px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;min-width:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card .em{font-size:2rem;line-height:1}
.card .n{font-size:.78rem;font-weight:800;color:var(--acc);letter-spacing:.05em;text-transform:uppercase}
.card h3{font-size:1.1rem}
.stars{font-size:1.05rem;letter-spacing:2px;color:var(--sun);margin-top:auto}
.stars .off{color:var(--line)}
.soon{border-style:dashed;opacity:.75}
.defi{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:20px;padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-decoration:none}
.defi h2{font-size:1.5rem}.defi .ar{color:var(--sun)}
.defi .go{margin-inline-start:auto;background:var(--sun);color:#15303D;border-radius:12px;padding:10px 18px;font-weight:800}
/* lesson */
.lesson{--pad:18px}
.back{display:inline-flex;margin:16px 0 4px;color:var(--muted);font-weight:800;text-decoration:none;min-height:40px;align-items:center}
.lh{background:var(--accbg);border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center}
.lh .em{font-size:3.2rem;line-height:1}
.lh .n{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.lh h1{font-size:clamp(1.5rem,5.5vw,2.1rem);margin:2px 0}
.sec{margin-top:28px}
.sec>h2{font-size:1.4rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.sec>h2 .ar{font-size:1.15rem;font-weight:700}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.box .lab{font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between;gap:8px}
.learn{display:grid;gap:10px}
.learn .box{border-inline-start:6px solid var(--acc)}
.words{display:flex;flex-wrap:wrap;gap:10px}
.word{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 14px;min-height:56px}
.word:hover{border-color:var(--acc)}
.word .sp{font-size:1.1rem}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ex{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;justify-items:start;min-width:0}
.ex .e{font-size:2rem;line-height:1.1}
.ex .t{font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.chip{display:inline-block;margin-top:6px;font-size:.8rem;font-weight:800;background:var(--accbg);color:var(--acc);border-radius:8px;padding:1px 10px}
.chip.a{background:var(--okbg);color:var(--ok)}.chip.b{background:var(--badbg);color:var(--bad)}
.note{border-radius:16px;padding:14px 16px;background:var(--surface);border:2px dashed var(--line);display:grid;gap:2px}
.note .lab{font-family:var(--fd);font-weight:800;font-size:1.1rem}
.note.warn{border-color:var(--bad)}.note.fact{border-color:var(--sun)}
.figbox{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:16px;align-items:center}
.figbox svg{width:100%;height:auto;max-height:380px}
.figbox .cap{min-height:3.6em}
.fig line,.fig circle.head{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.fig .j{fill:var(--acc);stroke:var(--surface);stroke-width:3;cursor:pointer;transition:r .12s}
.fig .j:hover{r:12}
.fig .j.on{fill:var(--sun)}
.fig .j.ok{fill:var(--ok)}
/* exercises */
.xc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.xc.fin{border-color:var(--ok)}
.xc .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xc .p{font-weight:800;font-size:1.1rem}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 16px;min-height:52px;text-align:start;min-width:0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}
.fb{min-height:0}
.fb .m{border-radius:12px;padding:10px 14px}
.fb .m.ok{background:var(--okbg);color:var(--ink)}
.fb .m.bad{background:var(--badbg);color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.done{opacity:.95}
.row .lab{display:flex;gap:10px;align-items:center;min-width:0}
.row .lab .e{font-size:1.7rem}
.row .opts{justify-content:flex-end;gap:8px}
.row .opt{min-height:44px;padding:4px 12px;font-size:.95rem}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .opts{justify-content:flex-start}.tabs2,.figbox{grid-template-columns:1fr}}
.result{text-align:center;display:grid;gap:8px;justify-items:center;background:var(--accbg);border-radius:22px;padding:24px 16px}
.result .big{font-size:2.6rem;letter-spacing:6px;color:var(--sun)}
.result h2{font-size:1.7rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:800;text-decoration:none;min-height:48px;display:inline-flex;align-items:center}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function figure(onPick){
  const L=[[100,62,100,176],[72,86,128,86],[84,182,116,182],[72,86,48,134],[48,134,34,180],[128,86,152,134],[152,134,166,180],[84,182,76,246],[76,246,72,304],[116,182,124,246],[124,246,128,304],[72,304,58,312],[128,304,142,312]];
  const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 200 330');svg.setAttribute('class','fig');svg.setAttribute('role','group');svg.setAttribute('aria-label','Corps humain avec les articulations');
  const hd=document.createElementNS(ns,'circle');hd.setAttribute('class','head');hd.setAttribute('cx',100);hd.setAttribute('cy',30);hd.setAttribute('r',20);svg.append(hd);
  L.forEach(a=>{const l=document.createElementNS(ns,'line');['x1','y1','x2','y2'].forEach((k,i)=>l.setAttribute(k,a[i]));svg.append(l)});
  const dots=[];
  for(const k in JP)JP[k].forEach(([x,y])=>{const c=document.createElementNS(ns,'circle');c.setAttribute('class','j');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',9);c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label',J[k][0]);c.dataset.k=k;
    const fire=()=>onPick(k,c);c.addEventListener('click',fire);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire()}});svg.append(c);dots.push(c)});
  return {svg,dots};
}

function qEx(ex,cb){
  let tries=0,done=false;const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});const box=h('div',{class:'opts'});
  ex.o.forEach((o,i)=>{const b=h('button',{type:'button',class:'opt'},biS(o));b.addEventListener('click',()=>{
    if(done||b.disabled)return;
    if(i===ex.a){done=true;b.classList.add('ok');fb.replaceChildren(h('div',{class:'m ok'},bi('Bravo ! '+(ex.w?sp(ex.w)[0]:''),'أحسنت! '+(ex.w?sp(ex.w)[1]:''))));cb(tries?0:1)}
    else{tries++;b.classList.add('bad');b.disabled=true;fb.replaceChildren(h('div',{class:'m bad'},bi('Pas tout à fait. Essaie encore !','ليس تمامًا، حاول مرة أخرى!')))}
  });box.append(b)});
  return [bi(ex.p,ex.pa,'p'),box,fb];
}
function sEx(ex,cb){
  const n=ex.i.length;let left=n,first=0;const rows=h('div');
  ex.i.forEach(([lab,ci])=>{
    let wrong=false,fin=false;const row=h('div',{class:'row'});const [f,a]=sp(lab);
    const em=/^\p{Extended_Pictographic}/u.test(f)?f.match(/^(\p{Extended_Pictographic}️?)\s*/u):null;
    const left_=h('div',{class:'lab'},em?h('span',{class:'e'},em[1]):null,bi(em?f.slice(em[0].length):f,a));
    const opts=h('div',{class:'opts'});
    ex.c.forEach((c,k)=>{const b=h('button',{type:'button',class:'opt'},biS(c));b.addEventListener('click',()=>{
      if(fin||b.disabled)return;
      if(k===ci){fin=true;b.classList.add('ok');row.classList.add('done');[...opts.children].forEach(x=>{if(x!==b)x.disabled=true});if(!wrong)first++;if(--left===0)cb(first/n)}
      else{wrong=true;b.classList.add('bad');b.disabled=true}
    });opts.append(b)});
    row.append(left_,opts);rows.append(row);
  });
  return [bi(ex.p,ex.pa,'p'),rows];
}
function fEx(ex,cb){
  let i=0,first=0,wrong=false;const prompt=h('div',{class:'p'});const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const show=()=>{const [f,a]=J[ex.g[i]];prompt.replaceChildren(bi('Touche : '+f.toLowerCase(),'المس: '+a))};show();

    if(i>=ex.g.length)return;
    if(k===ex.g[i]){if(!wrong)first++;wrong=false;fig.dots.filter(d=>d.dataset.k===k).forEach(d=>d.classList.add('ok'));i++;
      if(i>=ex.g.length){prompt.replaceChildren(bi('Bravo, tu connais tes articulations !','أحسنت! أنت تعرف مفاصلك!'));fb.replaceChildren();cb(first/ex.g.length)}
      else{fb.replaceChildren(h('div',{class:'m ok'},bi('Bravo !','أحسنت!')));show()}}

  });
  return [bi(ex.p,ex.pa,'p'),prompt,h('div',{style:'max-width:240px;margin:0 auto;width:100%'},fig.svg),fb];

function lesson(l,idx){
  const root=h('div',{class:'lesson'});setAcc(root,l.u);
  root.append(h('a',{class:'back',href:'#home'},'← Toutes les leçons'));
  root.append(h('div',{class:'lh'},h('span',{class:'em','aria-hidden':'true'},l.em),h('div',null,h('div',{class:'n'},l.n),h('h1',null,l.fr),h('div',{class:'ar',lang:'ar',dir:'rtl'},l.ar))));
  // découvrir
  root.append(sec('Je découvre','أكتشف',h('div',{class:'tabs2'},
    h('div',{class:'box'},h('div',{class:'lab'},h('span',null,'Je réfléchis'),h('span',{class:'ar'},'أتأمل')),bi(l.q[0],l.q[1])),
    h('div',{class:'box'},h('div',{class:'lab'},h('span',null,'Je pense'),h('span',{class:'ar'},'أظن')),bi(l.s[0],l.s[1])))));
  // retenir
  const learn=h('div',{class:'learn'});
  l.learn.forEach(([f,a])=>{const sp_=h('button',{type:'button',class:'pill','aria-label':'Écouter',style:'align-self:start;margin-top:6px'},'🔊 Écouter');sp_.addEventListener('click',()=>speak(f.replace(/[①②③④]/g,''),'fr-FR'));learn.append(h('div',{class:'box'},bi(f,a),sp_))});
  root.append(sec('Je retiens','أتعلّم',learn));
  // figure
  if(l.fig){
    const cap=h('div',{class:'cap'},bi('Touche un point rouge pour voir le nom de l\'articulation.','المس نقطة لترى اسم المفصل.'));
    const fg=figure((k,c)=>{fg.dots.forEach(d=>d.classList.toggle('on',d.dataset.k===k));const [f,a]=J[k];cap.replaceChildren(h('div',{style:'font-family:var(--fd);font-size:1.5rem;font-weight:800'},f),h('div',{class:'ar',style:'font-size:1.3rem'},a));speak(f,'fr-FR')});
    root.append(sec('Mon corps et mes articulations','جسمي ومفاصلي',h('div',{class:'box figbox'},h('div',null,fg.svg),cap)));
  }
  // mots
  root.append(sec('Mots clés','كلمات مفتاحية',h('div',{class:'words'},l.words.map(([w])=>{const [f,a]=sp(w);const b=h('button',{type:'button',class:'word','aria-label':'Écouter '+f},h('span',{class:'sp','aria-hidden':'true'},'🔊'),bi(f,a));b.addEventListener('click',()=>speak(f,'fr-FR'));return b}))));
  // exemples
  const exg=h('div',{class:'exs'});
  l.ex.forEach(([e,t,tag,k])=>{const [f,a]=sp(t);const tg=tag?sp(tag):null;exg.append(h('div',{class:'ex'},h('span',{class:'e','aria-hidden':'true'},e),h('div',{class:'t'},f),h('span',{class:'ar',lang:'ar',dir:'rtl'},a),tg?h('span',{class:'chip '+(k||'')},tg[0]+' · '+tg[1]):null))});
  root.append(sec('Exemples','أمثلة',exg));
  if(l.ex2){const g2=h('div',{class:'exs'});l.ex2.forEach(([e,t,tag,k])=>{const [f,a]=sp(t);const tg=sp(tag);g2.append(h('div',{class:'ex'},h('span',{class:'e'},e),h('div',{class:'t'},f),h('span',{class:'ar',lang:'ar',dir:'rtl'},a),h('span',{class:'chip '+(k||'')},tg[0]+' · '+tg[1])))});root.append(sec(l.ex2title[0],l.ex2title[1],g2))}
  if(l.warn)root.append(h('div',{class:'note warn',style:'margin-top:18px'},h('div',{class:'lab'},'⚠️ Sécurité'),bi(l.warn[0],l.warn[1])));
  if(l.fact)root.append(h('div',{class:'note fact',style:'margin-top:18px'},h('div',{class:'lab'},'Sais-tu que ? · هل تعلم؟'),bi(l.fact[0],l.fact[1])));
  root.append(h('div',{class:'note',style:'margin-top:18px'},h('div',{class:'lab'},'Parlons-en · تحدّث معه'),bi(l.talk[0],l.talk[1])));
  root.append(exercises(l.xs,l.id,idx));
  return root;
}

function exercises(xs,id,idx,title){
  const wrap=h('section',{class:'sec'});wrap.append(h('h2',null,h('span',null,'Je m\'entraîne'),h('span',{class:'ar',lang:'ar',dir:'rtl'},'أتدرّب')));
  const res=[];const out=h('div');let n=0;
  xs.forEach((ex,i)=>{
    const card=h('div',{class:'xc'});card.append(h('div',{class:'k'},'Exercice '+(i+1)+' sur '+xs.length));
    const f=ex.t==='q'?qEx:ex.t==='s'?sEx:ex.t==='o'?oEx:fEx;
    const parts=f(ex,sc=>{res[i]=sc;card.classList.add('fin');if(res.filter(x=>x!==undefined).length===xs.length)finish()});
    card.append(...parts);out.append(card);
  });
  const resultBox=h('div');
  function finish(){
    const score=res.reduce((a,b)=>a+b,0);const total=xs.length;
    if(id==='defi'){const p=getP();const old=p.defi;if(!old||score>=old.s)p.defi={s:score,t:total};store.set(p)}else saveScore(id,score,total);
    const st=starsOf({s:score,t:total});
    const next=(typeof idx==='number'&&LESSONS[idx+1])?LESSONS[idx+1]:null;
    const msg=st===3?['Super champion !','أنت بطل رائع!']:st===2?['Très bien !','أحسنت جدًا!']:['Bien joué, recommence pour avoir plus d\'étoiles !','أحسنت، أعد المحاولة لتحصل على نجوم أكثر!'];
    resultBox.replaceChildren(h('div',{class:'result'},h('div',{class:'big','aria-label':st+' étoiles'},'★'.repeat(st)+'☆'.repeat(3-st)),h('h2',null,msg[0]),h('div',{class:'ar'},msg[1]),h('div',null,Math.round(score*10)/10+' / '+total),
      h('div',{class:'btns'},h('button',{type:'button',class:'btn alt',onclick:()=>route(true)},'Recommencer · إعادة'),next?h('a',{class:'btn',href:'#'+next.id},'Leçon suivante →'):null,h('a',{class:'btn alt',href:'#home'},'Accueil'))));
    resultBox.scrollIntoView({behavior:'smooth',block:'center'});
  }
  wrap.append(out,resultBox);return wrap;
}

function defi(){
  const pool=[];LESSONS.forEach(l=>l.xs.forEach(x=>{if(x.t==='q')pool.push(x);else if(x.t==='s')x.i.forEach(it=>pool.push({t:'q',p:x.p,pa:x.pa,o:x.c.slice(),a:it[1],w:'',_label:it[0]}))}));
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const pick=shuffle(pool).slice(0,10).map(x=>{if(!x._label)return x;const [f,a]=sp(x._label);const clean=s=>s.replace(/^\p{Extended_Pictographic}️?\s*/u,'');return Object.assign({},x,{p:x.p+' « '+clean(f)+' »',pa:a?x.pa+' «'+a+'»':x.pa,_label:null})});
  const root=h('div',{class:'lesson'});setAcc(root,1);
  root.append(h('a',{class:'back',href:'#home'},'← Toutes les leçons'));
  root.append(h('div',{class:'lh'},h('span',{class:'em'},'🏆'),h('div',null,h('div',{class:'n'},'Toutes les leçons'),h('h1',null,'Défi final'),h('div',{class:'ar'},'التحدي النهائي: 10 أسئلة مختلطة'))));
  root.append(exercises(pick,'defi',null));return root;
}

/* ---------- routage ---------- */
function route(force){
  const id=(location.hash||'#home').slice(1);
  let v;
  if(id==='defi')v=defi();
  else{const i=LESSONS.findIndex(l=>l.id===id);v=i>=0?lesson(LESSONS[i],i):home()}
  app.replaceChildren(v);
  if(!force)window.scrollTo(0,0);else window.scrollTo(0,0);
}
addEventListener('hashchange',()=>route());
const arBtn=document.getElementById('arBtn');
let arOn=true;try{arOn=localStorage.getItem('francais-ar')!=='0'}catch(e){}
function applyAr(){document.body.classList.toggle('noar',!arOn);arBtn.setAttribute('aria-pressed',String(arOn))}
arBtn.addEventListener('click',()=>{arOn=!arOn;try{localStorage.setItem('francais-ar',arOn?'1':'0')}catch(e){}applyAr()});
applyAr();route();
</script>
