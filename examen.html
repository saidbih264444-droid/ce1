<style>

:root[data-theme="dark"]{

  --ok:#46C592;--okbg:#17372C;--bad:#F0766E;--badbg:#3F2220;--sun:#F4C45A;--ar:#8FD3F0;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:500 18px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

button{font:inherit;color:inherit;cursor:pointer}

.ar{font-family:var(--fa);color:var(--ar);direction:rtl;text-align:right;font-weight:500;line-height:1.7}
.bi{display:flex;flex-direction:column;gap:0;min-width:0}
body.noar .ar{display:none}

.brand i{font-style:normal;background:var(--u1);color:#fff;border-radius:10px;padding:0 9px;font-size:1rem}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;min-height:40px;font-weight:800;font-size:.9rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* home */
.hero{padding:24px 0 8px;display:grid;gap:6px}

.card{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;min-width:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}

.stars{font-size:1.05rem;letter-spacing:2px;color:var(--sun);margin-top:auto}
.stars .off{color:var(--line)}

.defi{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:20px;padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-decoration:none}
.defi h2{font-size:1.5rem}.defi .ar{color:var(--sun)}
.defi .go{margin-inline-start:auto;background:var(--sun);color:#15303D;border-radius:12px;padding:10px 18px;font-weight:800}

.lesson{--pad:18px}

.ex .t{font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.chip{display:inline-block;margin-top:6px;font-size:.8rem;font-weight:800;background:var(--accbg);color:var(--acc);border-radius:8px;padding:1px 10px}

.note{border-radius:16px;padding:14px 16px;background:var(--surface);border:2px dashed var(--line);display:grid;gap:2px}
.note .lab{font-family:var(--fd);font-weight:800;font-size:1.1rem}
.note.warn{border-color:var(--bad)}.note.fact{border-color:var(--sun)}
.figbox{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:16px;align-items:center}
.figbox svg{width:100%;height:auto;max-height:380px}
.figbox .cap{min-height:3.6em}
.fig line,.fig circle.head{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.fig .j{fill:var(--acc);stroke:var(--surface);stroke-width:3;cursor:pointer;transition:r .12s}
.fig .j:hover{r:12}
.fig .j.on{fill:var(--sun)}
.fig .j.ok{fill:var(--ok)}

.xc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.xc.fin{border-color:var(--ok)}
.xc .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xc .p{font-weight:800;font-size:1.1rem}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 16px;min-height:52px;text-align:start;min-width:0}

.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.7}

.fb{min-height:0}
.fb .m{border-radius:12px;padding:10px 14px}
.fb .m.ok{background:var(--okbg);color:var(--ink)}
.fb .m.bad{background:var(--badbg);color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.done{opacity:.95}
.row .lab{display:flex;gap:10px;align-items:center;min-width:0}
.row .lab .e{font-size:1.7rem}
.row .opts{justify-content:flex-end;gap:8px}
.row .opt{min-height:44px;padding:4px 12px;font-size:.95rem}

.result{text-align:center;display:grid;gap:8px;justify-items:center;background:var(--accbg);border-radius:22px;padding:24px 16px}
.result .big{font-size:2.6rem;letter-spacing:6px;color:var(--sun)}
.result h2{font-size:1.7rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:800;text-decoration:none;min-height:48px;display:inline-flex;align-items:center}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.opt.sel{border-color:var(--acc);background:var(--accbg);font-weight:800}
.bar{position:sticky;bottom:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--bg);border-top:1px solid var(--line);margin-top:18px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.wrap ul{list-style:disc}
button.card{font:inherit;width:100%}
</style>

const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=s=>s.replace(/^\p{Extended_Pictographic}️?\s*/u,'');
const LINK='sciences.html';
const KINDS={
  u1:{fr:'Unité 1 · La santé humaine',ar:'الوحدة 1: صحة الإنسان',n:10,min:20,em:'🧍',d:['Les sens, le toucher, les articulations, le sport.','الحواس، اللمس، المفاصل، الرياضة.']},
  u2:{fr:'Unité 2 · L\'alimentation',ar:'الوحدة 2: التغذية',n:10,min:20,em:'🍎',d:['Les repas, la mastication, les dents, l\'hygiène.','الوجبات، المضغ، الأسنان، النظافة.']},
  all:{fr:'Examen complet',ar:'الامتحان الشامل',n:20,min:40,em:'🏆',d:['Toutes les leçons : 20 questions.','كل الدروس: 20 سؤالًا.']}
};
const poolOf=l=>{const out=[];l.xs.forEach(x=>{
  if(x.t==='q')out.push({lid:l.id,p:x.p,pa:x.pa,o:x.o,a:x.a,w:x.w||''});
  else if(x.t==='s')x.i.forEach(it=>{const [f,a]=sp(it[0]);out.push({lid:l.id,p:x.p+' « '+clean(f)+' »',pa:a?x.pa+' «'+a+'»':x.pa,o:x.c,a:it[1],w:''})});
});return out};
function build(kind){
  const ls=kind==='u1'?LESSONS.filter(l=>l.u<=1):kind==='u2'?LESSONS.filter(l=>l.u===2):LESSONS;
  const target=KINDS[kind].n;const picks=[],rest=[];
  ls.forEach(l=>{const p=shuffle(poolOf(l));if(p.length){picks.push(p[0]);rest.push(...p.slice(1))}});
  let qs=shuffle(picks).slice(0,target);
  const extra=shuffle(rest);while(qs.length<target&&extra.length)qs.push(extra.pop());
  qs.sort((a,b)=>LESSONS.findIndex(l=>l.id===a.lid)-LESSONS.findIndex(l=>l.id===b.lid));
  return qs.map(q=>{const vf=q.o.some(o=>/^Vrai\|/.test(o));const opts=q.o.map((t,i)=>({t,ok:i===q.a}));return Object.assign({},q,{opts:vf?opts:shuffle(opts)})});
}
const bestOf=k=>{const p=store.get();return p.exam&&p.exam[k]};
function saveBest(k,s,t){const p=store.get();p.exam=p.exam||{};const o=p.exam[k];if(!o||s/t>=o.s/o.t)p.exam[k]={s,t};store.set(p)}
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');
let timer=null;const stopTimer=()=>{if(timer){clearInterval(timer);timer=null}};

function start(){
  stopTimer();
  const root=h('div',null);
  root.append(h('div',{class:'hero'},h('h1',null,'Examen de sciences'),bi('Je teste ce que j\'ai appris. La correction arrive à la fin.','أختبر ما تعلمته. التصحيح يظهر في النهاية.')));
  root.append(h('div',{class:'note',style:'margin-top:18px'},h('div',{class:'lab'},'Règles de l\'examen · قواعد الامتحان'),
    h('ul',{style:'margin:6px 0 0;padding-inline-start:20px;display:grid;gap:4px'},
      h('li',null,bi('Je lis bien chaque question.','أقرأ كل سؤال جيدًا.')),
      h('li',null,bi('Je choisis une seule réponse. Je peux la changer avant de terminer.','أختار جوابًا واحدًا، ويمكنني تغييره قبل الإنهاء.')),

    g.append(h('button',{type:'button',class:'card',onclick:()=>exam(k)},h('span',{class:'em','aria-hidden':'true'},K.em),h('span',{class:'n'},K.n+' questions · '+K.min+' min'),h('h3',null,K.fr),h('span',{class:'ar',lang:'ar',dir:'rtl'},K.ar),h('div',{class:'sub',style:'color:var(--muted);font-size:.9rem'},K.d[0]),
      b?h('div',{class:'chip a',style:'justify-self:start'},'Meilleur score : '+b.s+' / '+b.t+' · '+fmt(b.s/b.t*10)+' / 10'):h('div',{class:'chip',style:'justify-self:start'},'Pas encore passé')));
  });
  root.append(h('div',{class:'unit'},h('h2',null,h('span',null,'Choisis ton examen'),h('span',{class:'ar',lang:'ar',dir:'rtl'},'اختر امتحانك')),g));
  root.append(h('p',{style:'margin-top:24px'},h('a',{href:LINK,target:'_blank',rel:'noopener'},'Revoir les leçons de sciences ↗')));
  app.replaceChildren(root);window.scrollTo(0,0);
}

function exam(kind){
  stopTimer();const K=KINDS[kind];const qs=build(kind);const ans=new Array(qs.length).fill(null);let warned=false,leave=false;const t0=Date.now();
  const root=h('div',null);
  const clock=h('span',{class:'pill',style:'font-variant-numeric:tabular-nums'},'⏱ 00:00');
  const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);clock.textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  timer=setInterval(tick,1000);
  const quit=h('button',{type:'button',class:'pill'},'Quitter');
  quit.addEventListener('click',()=>{if(!leave){leave=true;quit.textContent='Confirmer : quitter';setTimeout(()=>{leave=false;quit.textContent='Quitter'},3000)}else start()});
  root.append(h('div',{class:'lh',style:'margin-top:16px'},h('span',{class:'em','aria-hidden':'true'},K.em),h('div',{style:'flex:1;min-width:0'},h('div',{class:'n'},'Examen · '+qs.length+' questions'),h('h1',null,K.fr),h('div',{class:'ar',lang:'ar',dir:'rtl'},K.ar),h('div',{style:'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap'},clock,quit))));
  const cnt=h('span',{style:'font-weight:800'});const warn=h('div',{class:'ar',style:'font-size:.9rem'});
  const fin=h('button',{type:'button',class:'btn'},'Terminer l\'examen');
  const upd=()=>{const d=ans.filter(x=>x!==null).length;cnt.textContent=d+' / '+qs.length+' réponses';warn.textContent=''};
  qs.forEach((q,i)=>{
    const opts=h('div',{class:'opts',role:'radiogroup'});
    q.opts.forEach((o,j)=>{const b=h('button',{type:'button',class:'opt',role:'radio','aria-checked':'false'},biS(o.t));b.addEventListener('click',()=>{
      ans[i]=j;[...opts.children].forEach((x,k)=>{x.classList.toggle('sel',k===j);x.setAttribute('aria-checked',String(k===j))});upd()});opts.append(b)});
    root.append(h('div',{class:'xc',style:'margin-top:14px'},h('div',{class:'k'},'Question '+(i+1)+' sur '+qs.length),bi(q.p,q.pa,'p'),opts));
  });
  const bar=h('div',{class:'bar'},h('div',{style:'display:grid;gap:2px;min-width:0'},cnt,warn),fin);
  root.append(bar);upd();
  fin.addEventListener('click',()=>{
    const left=ans.filter(x=>x===null).length;
    if(left&&!warned){warned=true;warn.replaceChildren(h('span',null,left+' question(s) sans réponse. Clique encore pour terminer · '+left+' أسئلة بدون جواب'));fin.textContent='Terminer quand même';return}
    stopTimer();result(kind,qs,ans,Math.floor((Date.now()-t0)/1000));
  });
  app.replaceChildren(root);window.scrollTo(0,0);
}

function result(kind,qs,ans,secs){
  const K=KINDS[kind];const score=qs.reduce((s,q,i)=>s+(ans[i]!==null&&q.opts[ans[i]].ok?1:0),0);const n=qs.length;const pct=score/n;
  saveBest(kind,score,n);
  const st=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  const m=pct>=.9?['Excellent ! Tu connais très bien ta leçon.','ممتاز! أنت تعرف درسك جيدًا.']:pct>=.7?['Très bien ! Encore un petit effort.','جيد جدًا! مجهود صغير آخر.']:pct>=.5?['Bien. Relis les leçons marquées en rouge.','حسن. أعد قراءة الدروس المعلّمة بالأحمر.']:['Courage ! Révise les leçons puis recommence.','تشجّع! راجع الدروس ثم أعد المحاولة.'];
  const root=h('div',null);
  root.append(h('div',{class:'result',style:'margin-top:20px'},h('div',{class:'big','aria-label':st+' étoiles'},'★'.repeat(st)+'☆'.repeat(3-st)),h('h2',null,fmt(pct*10)+' / 10'),h('div',null,score+' bonnes réponses sur '+n+' · '+Math.floor(secs/60)+' min '+String(secs%60).padStart(2,'0')+' s'),bi(m[0],m[1]),
    h('div',{class:'btns'},h('button',{type:'button',class:'btn',onclick:()=>exam(kind)},'Nouvel examen · امتحان جديد'),h('button',{type:'button',class:'btn alt',onclick:start},'Accueil'),h('a',{class:'btn alt',href:LINK,target:'_blank',rel:'noopener'},'Revoir les leçons ↗'))));
  const rev=new Set();
  const list=h('div',{style:'margin-top:24px'});list.append(h('h2',{style:'font-size:1.4rem'},'La correction'),h('div',{class:'ar',lang:'ar',dir:'rtl'},'التصحيح'));
  qs.forEach((q,i)=>{
    const ok=ans[i]!==null&&q.opts[ans[i]].ok;if(!ok)rev.add(q.lid);
    const card=h('div',{class:'xc',style:'margin-top:14px;border-color:'+(ok?'var(--ok)':'var(--bad)')});
    card.append(h('div',{class:'k'},'Question '+(i+1)+' · '+(ok?'Juste ✓ · صحيح':'À corriger ✗ · يحتاج تصحيحًا')),bi(q.p,q.pa,'p'));
    const o=h('div',{class:'opts'});
    q.opts.forEach((x,j)=>{const b=h('div',{class:'opt'+(x.ok?' ok':(j===ans[i]?' bad':'')),style:'cursor:default;opacity:1'},biS(x.t));o.append(b)});
    card.append(o);
    if(ans[i]===null)card.append(h('div',{class:'chip b',style:'justify-self:start'},'Pas de réponse · بدون جواب'));
    if(q.w){const [f,a]=sp(q.w);card.append(h('div',{class:'m ok',style:'border-radius:12px;padding:10px 14px;background:var(--okbg)'},bi(f,a)))}
    if(!ok){const L=LESSONS.find(l=>l.id===q.lid);card.append(h('div',{class:'chip',style:'justify-self:start'},'À revoir : '+L.n.split(' · ')[0]+' · '+L.fr))}
    list.append(card);
  });
  root.append(list);app.replaceChildren(root);window.scrollTo(0,0);
}
